<style>
:root{--ink:#07120d;--moss:#1f5d36;--gold:#f2b632;--gold-d:#8a5410;--bark:#5a3a22;--bone:#f4e7c5;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--ink);color:var(--bone);font-family:"Press Start 2P","Courier New",monospace;overflow-x:hidden}
#world{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair;display:block}
main{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,3vh,28px);padding:56px 20px 40px;pointer-events:none;text-align:center}
main>*{pointer-events:auto}
h1{margin:0;font-weight:400;font-size:clamp(26px,7vw,68px);line-height:1;color:var(--gold);letter-spacing:2px;text-shadow:0 4px 0 var(--gold-d),0 8px 0 #3a2208,0 14px 0 rgba(0,0,0,.45);background:none;border:0;cursor:pointer;font-family:inherit;padding:4px 8px}
h1:focus-visible,a:focus-visible,button:focus-visible{outline:3px dashed var(--gold);outline-offset:4px}
h1 small{display:block;font-size:.34em;color:var(--bone);letter-spacing:6px;margin-top:14px;text-shadow:0 3px 0 #000}
.frame{position:relative;width:min(88vw,500px,58vh);aspect-ratio:1;background:var(--bark);padding:10px;
box-shadow:0 0 0 4px #2a170a,0 0 0 8px var(--gold),0 0 0 12px #2a170a,0 24px 0 6px rgba(0,0,0,.45)}
.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000}
.frame i{position:absolute;width:18px;height:18px;background:var(--gold);box-shadow:inset -4px -4px 0 var(--gold-d)}
.frame i:nth-of-type(1){left:-14px;top:-14px}.frame i:nth-of-type(2){right:-14px;top:-14px}
.frame i:nth-of-type(3){left:-14px;bottom:-14px}.frame i:nth-of-type(4){right:-14px;bottom:-14px}
.tag{margin:0;font-size:clamp(10px,1.8vw,15px);line-height:1.9;color:var(--bone);text-shadow:0 3px 0 #000}
.soon{font-size:clamp(10px,1.6vw,13px);padding:12px 18px;background:var(--moss);color:var(--bone);box-shadow:0 0 0 3px #0c2a17,0 6px 0 3px #0c2a17;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{background:#277a46}}
.xtab{position:fixed;z-index:5;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));display:block;padding:4px;background:var(--bark);box-shadow:0 0 0 3px #2a170a,0 0 0 6px var(--gold),0 6px 0 3px rgba(0,0,0,.4);transition:transform .15s steps(3)}
.xtab:hover,.xtab:focus-visible{transform:translateY(3px)}
.xtab img{display:block;width:64px;height:auto;image-rendering:pixelated}
#snd{position:fixed;z-index:5;right:14px;top:calc(14px + env(safe-area-inset-top,0px));font:inherit;font-size:10px;color:var(--bone);background:rgba(7,18,13,.7);border:3px solid var(--gold);padding:9px 11px;cursor:pointer}
.hint{position:fixed;z-index:3;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:8px;line-height:1.8;color:rgba(244,231,197,.75);pointer-events:none;padding:0 14px}
@media (max-width:560px){.xtab img{width:52px}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.soon{animation:none}.xtab{transition:none}}
</style>
</head>

<script>
(function(){
const S=4; // logical pixel size
const cv=document.getElementById('world'),cx=cv.getContext('2d');
let W,H,bg,rng,isl=[],fire=[],arrows=[],sparks=[],audio=null,sound=false;
const rand=s=>()=>((s=Math.imul(s^s>>>15,s|1),s^=s+Math.imul(s^s>>>7,s|61),(s^s>>>14)>>>0)/4294967296);
const R=(c,x,y,w,h)=>{c.fillStyle=c;};
function rect(g,col,x,y,w,h){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function pine(g,x,base,h,c1,c2){const tiers=Math.max(3,h/7|0);for(let i=0;i<tiers;i++){const w=(tiers-i)*3+2,y=base-h+i*(h/tiers)*0.9;for(let r=0;r<h/tiers+2;r++){const ww=Math.round(w*(r+1)/(h/tiers+2));rect(g,i%2?c2:c1,x-ww,y+r,ww*2+1,1);}}rect(g,'#2a170a',x-1,base-3,3,4);}
function castle(g,x,gy,u){const st='#8a8f98',dk='#5f646e',lt='#aab0ba';
 rect(g,st,x,gy-u*10,u*14,u*10);
 for(let i=0;i<7;i++)rect(g,st,x+i*u*2,gy-u*10-u,u,u);
 [[-u*2,u*16],[u*14,u*14]].forEach(([dx,th])=>{const tx=x+dx;rect(g,st,tx,gy-th,u*4,th);rect(g,lt,tx,gy-th,u,th);rect(g,dk,tx+u*3,gy-th,u,th);
  for(let i=0;i<3;i++)rect(g,st,tx+i*(u*2-1),gy-th-u,u,u);
  for(let r=0;r<u*3;r++)rect(g,'#2c6a3c',tx-1+r/2,gy-th-u*4+r,u*4+2-r,1);});
 rect(g,'#1a1a22',x+u*6,gy-u*5,u*2,u*5);rect(g,'#1a1a22',x+u*6+1,gy-u*6,u*2-2,1);
 rect(g,'#f2b632',x+u*3,gy-u*8,2,3);rect(g,'#f2b632',x+u*10,gy-u*8,2,3);}
function build(){
 W=Math.ceil(innerWidth/S);H=Math.ceil(innerHeight/S);cv.width=W;cv.height=H;
 bg=document.createElement('canvas');bg.width=W;bg.height=H;const g=bg.getContext('2d');rng=rand(7);
 const bands=['#0d1f3a','#12294a','#183458','#21436a','#2f5a7e','#4a7691','#78979c','#b3b296','#e9b36c','#f2c27a'];
 const hz=H*0.72;bands.forEach((c,i)=>rect(g,c,0,i*hz/bands.length,W,hz/bands.length+1));
 for(let i=0;i<W*H/260;i++){const y=rng()*hz*0.55;rect(g,rng()>.85?'#fff3c4':'#9fb6d6',rng()*W|0,y|0,1,1);}
 const mx=W*0.78,my=H*0.16,mr=Math.min(11,H*.07);for(let y=-mr;y<=mr;y++)for(let x=-mr;x<=mr;x++)if(x*x+y*y<=mr*mr)rect(g,(x+3)**2+(y-2)**2<mr*mr*.85?'#fff0bd':'#e2cc8c',mx+x,my+y,1,1);
 for(let i=0;i<5;i++){const cx0=rng()*W,cy0=H*(.1+rng()*.35),w=16+rng()*22;rect(g,'#c9d6e2',cx0,cy0,w,3);rect(g,'#e9eef2',cx0+4,cy0-2,w*.55,3);rect(g,'#9fb2c6',cx0+2,cy0+3,w-6,1);}
 // far hills
 for(let x=0;x<W;x++){const h=hz-8-Math.sin(x/23)*6-Math.sin(x/9)*2;rect(g,'#16402a',x,h,1,H-h);}
 castle(g,W*0.1,hz-6,Math.max(2,Math.min(4,W/110)|0));
 // tree layers
 for(let i=0;i<W/9;i++)pine(g,rng()*W,hz+2,18+rng()*14,'#15482c','#10391f');
 rect(g,'#0f2e1c',0,hz,W,H-hz);
 for(let i=0;i<W/6;i++)pine(g,rng()*W,hz+10+rng()*(H-hz-10),28+rng()*26,'#1f5d36','#154a29');
 for(let x=0;x<W;x+=1){const t=H-6-Math.sin(x/5)*1.5;rect(g,'#0a1a11',x,t,1,H-t);}
 // islands
 isl=[];const n=Math.max(3,Math.min(5,W/90|0));
 for(let i=0;i<n;i++)isl.push({x:W*(.2+.6*(i+.5)/n)+(rng()-.5)*20,y:H*(.2+rng()*.2),w:18+rng()*10,ph:rng()*6,hit:0});
 fire=[];for(let i=0;i<26;i++)fire.push({x:rng()*W,y:H*.5+rng()*H*.5,p:rng()*7,s:.3+rng()*.5});
}
function drawIsland(i,t){const y=i.y+Math.sin(t/900+i.ph)*2|0,x=i.x|0,w=i.w|0;
 for(let r=0;r<10;r++)rect(cx,r%3?'#6b4a2e':'#523620',x-w/2+r*(w/20),y+r,w-r*(w/10),1);
 rect(cx,'#3f8f4f',x-w/2,y-2,w,3);rect(cx,'#5fb065',x-w/2,y-2,w,1);
 pine(cx,x,y-1,14,'#2c7a42','#1f5d36');
 if(i.hit>0){rect(cx,'#f2b632',x-3,y-18-i.hit/3,6,3);rect(cx,'#fff0bd',x-2,y-18-i.hit/3,2,1);}
 i.cy=y;}
function tone(f,d){if(!sound)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();o.frequency.exponentialRampToValueAtTime(f/2,audio.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d);}catch(e){}}
function shoot(tx,ty){const sx=W/2,sy=H-3,dx=tx-sx,dy=ty-sy,L=Math.hypot(dx,dy)||1;arrows.push({x:sx,y:sy,vx:dx/L*2.4,vy:dy/L*2.4,tx,ty,trail:[]});tone(520,.18);}
function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=.4+Math.random()*1.3;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.4,l:24+Math.random()*14,c:Math.random()>.4?'#f2b632':'#fff0bd'});}}
function frame(t){
 cx.drawImage(bg,0,0);
 fire.forEach(f=>{const a=(Math.sin(t/500+f.p)+1)/2;f.x+=Math.sin(t/1300+f.p)*.1;f.y-=f.s*.05;if(f.y<H*.45)f.y=H;rect(cx,a>.5?'#fff0bd':'#b8c95a',f.x|0,f.y|0,1,1);});
 isl.forEach(i=>{drawIsland(i,t);if(i.hit>0)i.hit--;});
 arrows=arrows.filter(a=>{a.trail.push([a.x,a.y]);if(a.trail.length>9)a.trail.shift();a.x+=a.vx;a.y+=a.vy;
  a.trail.forEach((p,k)=>rect(cx,k>6?'#f2b632':k>3?'#b23a2a':'#5a3a22',p[0]|0,p[1]|0,1,1));rect(cx,'#fff0bd',a.x|0,a.y|0,2,2);
  const done=Math.hypot(a.tx-a.x,a.ty-a.y)<3||a.y<0;
  if(done){let hit=false;isl.forEach(i=>{if(Math.abs(a.x-i.x)<i.w/2+3&&Math.abs(a.y-(i.cy||i.y))<12){i.hit=36;hit=true;}});burst(a.x,a.y,hit?34:10);tone(hit?880:220,.25);}
  return !done;});
 sparks=sparks.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.l--;rect(cx,s.c,s.x|0,s.y|0,1,1);return s.l>0;});
 requestAnimationFrame(frame);}
cv.addEventListener('pointerdown',e=>{shoot(e.clientX/S,e.clientY/S);});
const logo=document.getElementById('logo');
logo.addEventListener('click',()=>{const r=logo.getBoundingClientRect();const n=isl[Math.random()*isl.length|0];shoot(n?n.x:W/2,n?n.cy||n.y:H/3);});
const sb=document.getElementById('snd');
sb.addEventListener('click',()=>{sound=!sound;sb.textContent=sound?'Sound on':'Sound off';sb.setAttribute('aria-pressed',sound);if(sound)tone(660,.2);});
addEventListener('resize',build);
// pixel-art treatment of the banner
const im=document.getElementById('src'),ac=document.getElementById('art'),ag=ac.getContext('2d');
function paint(){ag.imageSmoothingEnabled=true;ag.drawImage(im,0,0,200,200);const d=ag.getImageData(0,0,200,200),p=d.data,q=36;
 for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,Math.round(p[i]/q)*q);p[i+1]=Math.min(255,Math.round(p[i+1]/q)*q);p[i+2]=Math.min(255,Math.round(p[i+2]/q)*q);}
 ag.putImageData(d,0,0);}
if(im.complete)paint();else im.onload=paint;
build();requestAnimationFrame(frame);
})();
</script>
